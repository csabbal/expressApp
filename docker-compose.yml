services:
  mongo:
    networks:
      - app_network
    build:
      context: .
      dockerfile: mongoDockerfile
    ports:
      - "27017:27017"
    volumes:
      - ./data/dump/mongo-init-dump:/docker-entrypoint-initdb.d/dump
      - mongo_data:/data/db
    restart: unless-stopped
  express:
    networks:
      - app_network
    build:
      dockerfile: Dockerfile
      target: production
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/usr/src/app/uploads
networks:
  app_network:
    driver: bridge
volumes:
  uploads_data:
  mongo_data: